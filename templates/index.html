<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script type="text/javascript" src="./static/mywebscript.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h1 class="card-title text-center mb-4">Emotion Detector</h1>
                    <div class="mb-3">
                        <label for="textToAnalyze" class="form-label">Enter text to analyze:</label>
                        <textarea class="form-control" id="textToAnalyze" rows="4" placeholder="Type here..."></textarea>
                    </div>
                    <button class="btn btn-primary w-100 mb-4" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
                    <div id="system_response" class="alert alert-secondary text-center" role="alert">
                        Results will appear here.
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
