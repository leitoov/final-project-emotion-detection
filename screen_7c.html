<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { max-width: 700px; margin: 40px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: #fff; }
        .alert { min-height: 50px; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="text-center mb-4 text-primary">Emotion Detector</h1>
            <div class="mb-3">
                <label for="textToAnalyze" class="form-label fw-bold">Enter text to analyze:</label>
                <textarea class="form-control" id="textToAnalyze" rows="3" placeholder="Type here..."></textarea>
            </div>
            <button class="btn btn-primary w-100 mb-4 fw-semibold" id="runButton">Run Sentiment Analysis</button>
            <div id="system_response" class="alert alert-secondary text-center" role="alert">
                Invalid text! Please try again!
            </div>
        </div>
    </div>
</body>
</html>
